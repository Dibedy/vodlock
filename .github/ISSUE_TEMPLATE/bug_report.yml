name: Bug report
description: Report broken behavior without putting match results in the title.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SPOILLESS. Keep scores, winners, map counts, and later tournament matchups out of this report whenever possible.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Website
        - Browser extension
        - Round Studio
        - Automatic indexing
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest sequence of actions that reproduces the problem.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public VOD identifier
      description: Optional YouTube or Twitch video ID. Do not include private links or account cookies.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, or operating system and Python version for Round Studio.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I kept spoilers out of the issue title.
          required: true
        - label: I did not include credentials, cookies, or private video data.
          required: true
