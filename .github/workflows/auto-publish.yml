name: Auto-publish VOD indexes

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      process_vods:
        description: Discover and process eligible VODs
        type: boolean
        default: true
      retry_held:
        description: Retry held sources and recheck waiting dependencies
        type: boolean
        default: false
      chat_vod_id:
        description: Archive chat for an already published Twitch VOD ID
        type: string
        required: false

concurrency:
  group: vodlock-auto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      VODLOCK_ANALYSIS_MAX_GB: "5"
      VODLOCK_STREAM_ANALYSIS: "1"
      VODLOCK_YOUTUBE_POT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: python -m pip install -r indexer/requirements.txt
      - name: Prepare optional YouTube cookies
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            umask 077
            cookie_file="$RUNNER_TEMP/youtube-cookies.txt"
            printf '%s' "$YOUTUBE_COOKIES" > "$cookie_file"
            echo "VODLOCK_YOUTUBE_COOKIES=$cookie_file" >> "$GITHUB_ENV"
          fi
      - name: Start YouTube PO-token provider
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true
        run: |
          docker run --detach --rm --name vodlock-youtube-pot --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4416/ping; then exit 0; fi
            sleep 1
          done
          docker logs vodlock-youtube-pot
          exit 1
      - name: Install Twitch chat archiver
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true || inputs.chat_vod_id != ''
        run: |
          curl -fsSL https://github.com/lay295/TwitchDownloader/releases/download/1.56.5/TwitchDownloaderCLI-1.56.5-Linux-x64.zip -o "$RUNNER_TEMP/twitch-downloader.zip"
          unzip -q "$RUNNER_TEMP/twitch-downloader.zip" -d "$RUNNER_TEMP/twitch-downloader"
          twitch_downloader=$(find "$RUNNER_TEMP/twitch-downloader" -type f -name TwitchDownloaderCLI | head -n 1)
          chmod +x "$twitch_downloader"
          echo "TWITCH_DOWNLOADER=$twitch_downloader" >> "$GITHUB_ENV"
      - name: Process eligible VODs
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true
        env:
          RETRY_HELD: ${{ inputs.retry_held }}
        run: |
          args=()
          if [ "$RETRY_HELD" = "true" ]; then args+=(--retry-held); fi
          python indexer/auto_publish.py "${args[@]}"
      - name: Pipeline health summary
        if: always()
        run: python indexer/auto_publish.py --summary-only
      - name: Save held VOD diagnostics
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.process_vods == true)
        uses: actions/upload-artifact@v4
        with:
          name: held-vod-diagnostics-${{ github.run_id }}
          path: indexer/diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive published VOD chat
        if: inputs.chat_vod_id != ''
        env:
          VODLOCK_CHAT_VOD_ID: ${{ inputs.chat_vod_id }}
        run: python indexer/chat_archive.py "$VODLOCK_CHAT_VOD_ID"
      - name: Validate generated catalog
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true || inputs.chat_vod_id != ''
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/site.test.cjs
      - name: Save published indexes
        if: github.event_name != 'workflow_dispatch' || inputs.process_vods == true || inputs.chat_vod_id != ''
        run: |
          git config user.name "vodlock-bot"
          git config user.email "vodlock-bot@users.noreply.github.com"
          git pull --rebase --autostash origin main
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Generated files conflict with a newer repository update."
            exit 1
          fi
          python -m json.tool indexer/auto_state.json > /dev/null
          git add site/catalog.json site/indexes site/chats indexer/auto_state.json indexer/storyboards
          git diff --cached --quiet || git commit -m "Publish automatic VOD index"
          git push
      - name: Stop YouTube PO-token provider
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.process_vods == true)
        run: docker rm --force vodlock-youtube-pot || true
