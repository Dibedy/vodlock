name: Auto-publish VOD indexes

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the current site without processing a VOD
        type: boolean
        default: false

concurrency:
  group: vodlock-auto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      youtube-pot-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-node
        ports:
          - 4416:4416
    env:
      VERCEL_ORG_ID: team_RVbqStzk6bcBVRtZJdFZNCGK
      VERCEL_PROJECT_ID: prj_v4wVPQu8PDkHaPFu0x2EhMmOiPfR
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      VODLOCK_YOUTUBE_POT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: python -m pip install -r indexer/requirements.txt
      - run: python indexer/auto_publish.py
        if: inputs.deploy_only != true
      - name: Save published indexes
        run: |
          git config user.name "vodlock-bot"
          git config user.email "vodlock-bot@users.noreply.github.com"
          git add site/catalog.json site/indexes indexer/auto_state.json
          git diff --cached --quiet || git commit -m "Publish automatic VOD index"
          git push
      - name: Deploy VODLOCK
        if: env.VERCEL_TOKEN != ''
        run: |
          deployment_url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          npx --yes vercel@latest alias set "$deployment_url" vodlock.vercel.app --token "$VERCEL_TOKEN"
