name: Deploy SPOILLESS

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: spoilless-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_RVbqStzk6bcBVRtZJdFZNCGK
      VERCEL_PROJECT_ID: prj_v4wVPQu8PDkHaPFu0x2EhMmOiPfR
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify website behavior
        run: node --test tests/site.test.cjs
      - name: Verify deployment credentials
        run: test -n "$VERCEL_TOKEN"
      - name: Deploy production site
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
