name: Canonical broadcast pipeline CI
on:
  push:
    paths: [indexer/**, tests/**, .github/workflows/pipeline-ci.yml, compose.worker.yml]
  pull_request:
    paths: [indexer/**, tests/**, .github/workflows/pipeline-ci.yml, compose.worker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: spoilless_test
          POSTGRES_USER: spoilless
          POSTGRES_PASSWORD: test
        ports: [5432:5432]
        options: --health-cmd="pg_isready -U spoilless" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://spoilless:test@localhost:5432/spoilless_test
      DATABASE_URL: postgresql://spoilless:test@localhost:5432/spoilless_test
      PYTHONPATH: indexer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: indexer/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r indexer/requirements-dev.txt
      - run: python -m ruff check indexer/pipeline tests/test_pipeline*.py
      - run: python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports indexer/pipeline
      - run: python -m compileall -q indexer/pipeline
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/site.test.cjs tests/index.test.cjs tests/bridge.test.cjs tests/workflows.test.cjs
      - run: python -m pipeline.worker --migrate-only
      - run: docker build -f indexer/Dockerfile.worker -t spoilless-worker:test .
      - run: docker run --rm spoilless-worker:test node --version
      - run: docker run --rm spoilless-worker:test python -c "from yt_dlp.dependencies import yt_dlp_ejs; assert yt_dlp_ejs"
      - run: docker run --rm -e DATABASE_URL=postgresql://test:test@localhost/test spoilless-worker:test python -m pipeline.worker --check-config
      - run: docker run --rm --network host -e DATABASE_URL spoilless-worker:test python -m pipeline.worker --migrate-only
      - run: docker run --rm --network host -e DATABASE_URL spoilless-worker:test python -m pipeline.worker --once
